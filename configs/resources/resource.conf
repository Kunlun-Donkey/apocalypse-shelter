; ============================================================
; resources/resource.conf — 资源注册表 + 全局经济规则
; 小 CONF 索引文件: 列出本目录下所有资源定义文件
; ============================================================

[meta]
config_version = 1
schema = resource_registry
id = resource.registry

[registry]
; 全部资源定义文件(相对 configs/ 的路径)。新增资源 = 新增一个
; xxx.conf 并在此登记一行, 不修改任何代码
files = [
    resources/wood.conf,
    resources/steel.conf,
    resources/food.conf,
    resources/water.conf,
    resources/power.conf,
]

[economy]
; 全局经济规则(数值内容)
; 庇护所基础消耗: 每游戏小时(默认阶段人口=玩家+留守者, population 系统未开启)
upkeep_food_per_hour = 2
upkeep_water_per_hour = 2
; 所有存储类资源默认软上限系数(实际容量 = base_capacity * shelter_storage_bonus)
default_capacity = 200
; 资源溢出处理: discard(丢弃) / stop_production(停产)
overflow_policy = stop_production

[error_policy]
; 引用了不存在的资源 ID 时: fail(报错终止) / warn(告警跳过)
missing_ref_policy = fail
