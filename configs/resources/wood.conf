; ============================================================
; resource.wood — 木材
; ============================================================

[meta]
config_version = 1
schema = resource
id = resource.wood

[base]
name = 木材
name_en = Wood
description = 拆解旧建筑与林木获得的基础建材, 是前期建设的核心消耗。
category = material
rarity = common

[flow]
storable = true
base_capacity = 200
finite = false
tradable = true
trade_base_price = 2
; 是否为"流转型"资源(不入仓, 产需实时平衡, 如电力)
flow_type = stock

[value_curve]
; 爽文式成长曲线: 价值随进度衰减, 前期最贵
early_value = 5
mid_value = 3
late_value = 2

[sources]
; 主要获取渠道(tag)及权重, 用于事件/探索 loot 生成倾向
primary = building_production
secondary = exploration_loot
tertiary = event_reward
channels = [building_production, exploration_loot, event_reward, quest_reward, trade]

[tags]
tags = [material, basic, building]
