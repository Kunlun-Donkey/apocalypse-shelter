; ============================================================
; Apocalypse Shelter - BIG CONF (system.conf)
; 职责: 仅负责"系统级开关 / 依赖声明 / 开发阶段 PROFILE"
; 禁止: 在本文件中写入具体游戏数值内容(建筑/资源/事件数据等)
; 规范: CONF-D v2  (见 docs/Apocalypse_Shelter_Core_World_Config_Specification_v0.2.md)
; ============================================================

[meta]
config_version = 1
schema = system
id = system.main
; 本文件是唯一的"大 CONF", 由 ConfigManager 最先加载

; ------------------------------------------------------------
; [profile] 开发阶段预设。
; 预设只会"建议"默认开关组合, 最终仍以 [system] 中显式开关为准
; (显式值覆盖预设值)。可选: prototype / vertical_slice / development
; / full_game / debug / test
; ------------------------------------------------------------
[profile]
profile = prototype

; ------------------------------------------------------------
; [system] 功能系统总开关。true=初始化该系统并加载其小 CONF
;          false=完全不初始化(内容文件可存在, 但功能不运行)
; CORE 组恒为 true(引擎最小内核), 不在此列出: core / config / save / time / ui
; 当前开发阶段: Dev-S1 (庇护所+升级, 无资源) — 见 AGENTS.md §1
; ------------------------------------------------------------
[system]
resource = false
shelter = true
building = false

production = false
survivor = false
npc = false
population = false
exploration = false
map = false
location = false
loot = false
wildlife = false
animal = false
enemy = false
combat = false
item = false
equipment = false
crafting = false
technology = false
quest = false
event = false
story = false
weather = false
world = false
trade = false
merchant = false
medical = false
morale = false
defense = false
disaster = false
achievement = false
steam = false
audio = false
settings = true

; ------------------------------------------------------------
; [dependencies] 系统硬依赖声明: 系统 = 依赖1, 依赖2, ...
; 启用某系统时其依赖必须同为 true, 否则 ConfigManager 以
; MissingDependency 错误终止启动(不允许悄悄运行在错误状态)
; ------------------------------------------------------------
[dependencies]
building = shelter, resource
production = building, resource
survivor = population, building
population = shelter
npc = shelter
exploration = map, location, survivor
map = shelter
location = map, loot
loot = resource
wildlife = map
animal = wildlife
enemy = shelter
combat = enemy
item = resource
equipment = item
crafting = item, building
technology = building
quest = npc, event
event = shelter
story = quest
weather = time
world = time
trade = item, resource, npc
merchant = trade
medical = building, item
morale = population
defense = building
disaster = weather, event
achievement = core
steam = core

; ------------------------------------------------------------
; [soft_dependencies] 软依赖: 开启后丰富玩法但不强制。
; ConfigManager 不因软依赖缺失而阻止启动, 只在启用方内部做功能降级
; (例: combat 无 equipment 时徒手战斗, 有 equipment 时读装备加成)
; ------------------------------------------------------------
[soft_dependencies]
combat = equipment, survivor, item
enemy = map
loot = map, location
world = weather
production = survivor

; ------------------------------------------------------------
; [engine] 启动级硬性参数。缺失时使用默认值, 但时间倍率等
; 核心字段缺失会触发 ConfigError
; ------------------------------------------------------------
[engine]
; 1 游戏日 = 24 游戏小时; 1 游戏小时 = 60 现实秒 (默认)
real_seconds_per_game_hour = 60
; 存档槽位数量
save_slots = 3
; 配置加载失败时是否允许进入只读调试模式(正式版必须 false)
allow_debug_fallback = false
