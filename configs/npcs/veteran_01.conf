; ============================================================
; npc.veteran_01 — 陈少强 (老兵 / npc_type = veteran)
; 觅食专长: 提升全队获取食物的速度; 主动 紧急搜刮: 一次性获得食物
; 庇护所加成: 攻击 +25% + 全员 hp_max +20% (百分比, 逻辑书 A9.3)
; 开局三位候选同伴之一 (三选一, 见 shelter.conf starter_npcs)
; ============================================================

[meta]
config_version = 1
schema = npc
id = npc.veteran_01

[base]
name = 陈少强
title = 老兵
identity = 曾经驻守边疆的老兵, 灾难爆发后带领小队逃到避难所。熟悉野外搜寻与物资保存, 做事沉稳可靠, 擅长外出搜集食物资源。
familiarity = 35
; 属性 (体力/生存/智慧, 上限 10, 对应招募面板属性条)
attr_stamina = 8
attr_survival = 7
attr_wisdom = 4
spawn_region = [location.shelter_valley]
spawn_condition = game_start_pick
repeatable = false
recruit_allowed = true

[passive]
npc_type = veteran
; 被动【觅食专长】: 提升全队获取食物的速度
skill = foraging_mastery
food_gain_bonus_percent = 20
; 招募 → 庇护所属性加成 (百分比, 等级基础值×%/100 四舍五入)
shelter_attack_bonus_percent = 25
shelter_hp_bonus_percent = 20

[active]
; 主动【紧急搜刮】: 一次性获得一定数量食物
skill = emergency_scavenge
skill_cooldown_hours = 24
skill_food_gain = 30

[functions]
services = [scavenge]
trade_table = []
quests = []
events = []

[tags]
tags = [companion, starter, veteran]
