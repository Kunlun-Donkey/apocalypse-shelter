; ============================================================
; shelter_levels — 庇护所等级表 (第一阶段开放 Lv1~Lv3)
; 完整设计为 Lv1~Lv12, 本文件仅包含 MVP 可达等级;
; 后续阶段追加 [level.4]~[level.12] 即可, 无需改代码
;
; 完整命名链 (小木屋 → 超级堡垒, 与 docs PART G1 一致):
;   Lv1 小木屋      Lv2 加固木屋    Lv3 修补营地   Lv4 围墙营地
;   Lv5 铁皮聚落    Lv6 铁壁据点    Lv7 要塞雏形   Lv8 坚固要塞
;   Lv9 钢铁之心    Lv10 黎明之光   Lv11 人类灯塔  Lv12 超级堡垒
; visual_stage 五段: cabin(1-2) / camp(3-4) / outpost(5-6) /
;                    fortress(7-8) / stronghold(9-12)
; ============================================================

[meta]
config_version = 1
schema = shelter_levels
id = shelter.levels

; ------------------------------------------------------------
; Lv1 小木屋
; ------------------------------------------------------------
[level.1]
name = 小木屋
description = 一栋漏风的小木屋, 木板墙还留着灾变前的样子。先把发电机点亮。
visual_stage = cabin
population_cap = 5
building_slots = 4
storage_bonus = 0
production_bonus_percent = 0
defense = 10
; 庇护所基础拾荒收入(每游戏小时); 钢是前期瓶颈(饥渴感), 但不再死锁
income_wood_per_hour = 4
income_steel_per_hour = 3
unlocks_buildings = [building.generator, building.warehouse, building.lumber_yard, building.water_collector]
; npc 系统 Lv1 即开: 开局第一位同伴可派出干活 (见 shelter.conf initial_npcs)
unlocks_systems = [npc]
unlocks_locations = []
upgrade_cost_wood = 0
upgrade_cost_steel = 0
upgrade_cost_food = 0
upgrade_cost_water = 0
requirements_buildings = []
requirements_shelter_level = 0

; ------------------------------------------------------------
; Lv2 加固木屋
; ------------------------------------------------------------
[level.2]
name = 加固木屋
description = 木板墙钉上了捡来的铁皮, 屋顶不再漏雨。人们开始规划下一顿饭从哪来。
visual_stage = cabin
population_cap = 10
building_slots = 6
storage_bonus = 100
production_bonus_percent = 5
defense = 25
income_wood_per_hour = 5
income_steel_per_hour = 4
unlocks_buildings = [building.farm, building.salvage_workshop]
unlocks_systems = []
unlocks_locations = [location.suburb_edge]
upgrade_cost_wood = 300
upgrade_cost_steel = 150
upgrade_cost_food = 50
upgrade_cost_water = 50
requirements_buildings = [building.generator:2, building.warehouse:1]
requirements_shelter_level = 1

; ------------------------------------------------------------
; Lv3 修补营地
; ------------------------------------------------------------
[level.3]
name = 修补营地
description = 木屋周围围出了一小块营地, 补上的墙皮挡住了风, 夜里终于能睡个整觉。
visual_stage = camp
population_cap = 20
building_slots = 8
storage_bonus = 250
production_bonus_percent = 10
defense = 50
income_wood_per_hour = 7
income_steel_per_hour = 5
unlocks_buildings = []
unlocks_systems = [survivor]
unlocks_locations = [location.city_ruin_gate]
upgrade_cost_wood = 800
upgrade_cost_steel = 400
upgrade_cost_food = 200
upgrade_cost_water = 200
requirements_buildings = [building.generator:3, building.lumber_yard:2, building.water_collector:2]
requirements_shelter_level = 2
