; ============================================================
; shelter.shelter — 庇护所基础定义
; ============================================================

[meta]
config_version = 1
schema = shelter
id = shelter.main

[base]
name = 晨星哨站
description = 由旧郊区检查站改建的末世庇护所。一切从这里开始。
location_id = location.shelter_valley
; 完整等级表见 shelter/shelter_levels.conf
levels_file = shelter/shelter_levels.conf
max_level = 12
; 第一阶段开放到的等级(mvp_max_level)
mvp_max_level = 3

[visual]
scene = shelter/shelter_main.tscn
; 各等级视觉表现切换由 visual_stage 字段驱动, 场景本身不变
visual_stages = [outpost, camp, settlement]

[initial_state]
; 新开局状态: 初始建筑(由 BuildingSystem 实例化)
initial_buildings = [building.generator, building.warehouse]
initial_building_level = 1
; 初始资源包
initial_resource_wood = 200
initial_resource_steel = 80
initial_resource_food = 60
initial_resource_water = 60

[tags]
tags = [core, shelter]
