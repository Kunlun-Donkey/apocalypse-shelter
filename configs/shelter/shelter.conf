; ============================================================
; shelter.shelter — 庇护所基础定义
; ============================================================

[meta]
config_version = 1
schema = shelter
id = shelter.main

[base]
name = 晨星哨站
description = 由一栋漏风的小木屋慢慢修起来的末世庇护所。一切从这里开始。
location_id = location.shelter_valley
; 完整等级表见 shelter/shelter_levels.conf
levels_file = shelter/shelter_levels.conf
max_level = 12
; 第一阶段开放到的等级(mvp_max_level)
mvp_max_level = 3

[visual]
scene = shelter/shelter_main.tscn
; 各等级视觉表现切换由 visual_stage 字段驱动, 场景本身不变
; 五段演变: cabin(小木屋) → camp(修补营地) → outpost(铁皮聚落) → fortress(要塞) → stronghold(超级堡垒)
visual_stages = [cabin, camp, outpost, fortress, stronghold]

[initial_state]
; 新开局状态: 初始建筑(由 BuildingSystem 实例化)
initial_buildings = [building.generator, building.warehouse]
initial_building_level = 1
; 初始资源包 (建材 + 约 3 游戏天口粮, 半挂机约 30 游戏小时攒出 Lv2)
initial_resource_wood = 200
initial_resource_steel = 100
initial_resource_food = 140
initial_resource_water = 60
; 开局第一位同伴: 四选一 (战斗/资源/陪伴/管家 各一, 新开局时玩家选定一个入队)
; npc 系统 Lv1 解锁; 定义见 npcs/guard_01|gatherer_01|companion_01|steward_01.conf
starter_npcs = [npc.guard_01, npc.gatherer_01, npc.companion_01, npc.steward_01]

[tags]
tags = [core, shelter]
