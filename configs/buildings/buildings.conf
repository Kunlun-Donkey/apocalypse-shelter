; ============================================================
; buildings/buildings.conf — 建筑注册表
; 新增建筑 = 在 buildings/ 下新增一个 xxx.conf 并登记一行
; ============================================================

[meta]
config_version = 1
schema = building_registry
id = building.registry

[registry]
files = [
    buildings/generator.conf,
    buildings/warehouse.conf,
    buildings/lumber_yard.conf,
    buildings/water_collector.conf,
    buildings/farm.conf,
    buildings/salvage_workshop.conf,
]

[defaults]
; 建筑全局默认值(单个建筑未写该字段时采用)
default_max_level = 5
default_size = 2x2
default_worker_requirement = 0
; 升级是否需要时间(分钟, 0=立即)。第一阶段为立即完成
upgrade_time_minutes = 0
; 建造是否受建筑槽位限制
respects_building_slots = true
